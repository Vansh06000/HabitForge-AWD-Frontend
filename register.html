<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HabitForge - Register</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #080808;
            color: #f5f5f5;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .logo {
            text-align: center;
            color: #d4af37;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #999;
            margin-bottom: 30px;
        }

        .register-card {
            background: #0d0d0d;
            border: 1px solid #39301a;
            border-radius: 16px;
            padding: 30px;
        }

        .form-label {
            color: #ddd;
        }

        .form-control {
            background: #151515;
            border: 1px solid #39301a;
            color: white;
            padding: 12px;
        }

        .form-control:focus {
            background: #151515;
            color: white;
            border-color: #d4af37;
            box-shadow: none;
        }

        .register-btn {
            width: 100%;
            background: #d4af37;
            color: #080808;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 8px;
            margin-top: 10px;
        }

        .register-btn:hover {
            background: #f0cf5c;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #999;
        }

        .login-link a {
            color: #d4af37;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="register-container">

        <div class="logo">
            HabitForge
        </div>

        <div class="subtitle">
            Create your account and start building better habits.
        </div>

        <div class="register-card">

            <form id="registerForm">

                <div class="mb-3">
                    <label class="form-label">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        class="form-control"
                        placeholder="Enter your name"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="Enter your email"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>

                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Create a password"
                        required>
                </div>

                <button
                    type="submit"
                    class="register-btn">
                    Create Account
                </button>

            </form>

            <div class="login-link">
                Already have an account?
                <a href="login.html">Login</a>
            </div>

        </div>

    </div>

    <script>

        const registerForm =
            document.getElementById("registerForm");

        registerForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                const name =
                    document.getElementById("name")
                        .value
                        .trim();

                const email =
                    document.getElementById("email")
                        .value
                        .trim();

                const password =
                    document.getElementById("password")
                        .value;

                try {

                    const response = await fetch(
                        "https://habitforge-server-k8gd.onrender.com/api/auth/register",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                name: name,
                                email: email,
                                password: password
                            })
                        }
                    );

                    const result =
                        await response.json();

                    if (!response.ok) {

                        alert(
                            result.message ||
                            "Registration failed."
                        );

                        return;
                    }

                    alert(
                        "Account created successfully!"
                    );

                    /*
                     * Registration does not create a login session.
                     * The user will log in through login.html.
                     */

                    window.location.href =
                        "login.html";

                } catch (error) {

                    console.error(
                        "Registration error:",
                        error
                    );

                    alert(
                        "Could not connect to the server. Please make sure the API is running."
                    );
                }

            }
        );

    </script>

</body>

</html>
